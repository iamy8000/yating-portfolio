<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Amy Yang — Frontend / full-stack engineer. Portfolio, projects, and experience. Based in New York." />
  <meta name="theme-color" content="#F0EFED" />
  <!-- Open Graph (LinkedIn, Facebook, etc.) — use absolute URLs for og:image -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Amy Yang" />
  <meta property="og:title" content="Amy Yang — Frontend Engineer" />
  <meta property="og:description" content="Amy Yang — Frontend / full-stack engineer. Portfolio, projects, and experience. Based in New York." />
  <meta property="og:url" content="https://yating-portfolio.vercel.app/" />
  <meta property="og:image" content="https://yating-portfolio.vercel.app/images/yy-profile-pic.jpeg" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Amy Yang — Frontend Engineer" />
  <meta name="twitter:description" content="Amy Yang — Frontend / full-stack engineer. Portfolio, projects, and experience. Based in New York." />
  <meta name="twitter:image" content="https://yating-portfolio.vercel.app/images/yy-profile-pic.jpeg" />
  <script>
    (function() {
      var t = localStorage.getItem('portfolio-theme');
      var isDark = t === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#0d1117' : '#F0EFED');
      var lang = localStorage.getItem('portfolio-locale');
      document.documentElement.lang = lang === 'zh-TW' ? 'zh-Hant' : 'en';
    })();
  </script>
  <title>Amy Yang — Frontend Engineer</title>
  <link rel="icon" href="/images/yy-profile-pic.jpeg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="/images/yy-profile-pic.jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
